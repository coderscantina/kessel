name: Release

# CalVer releases: scripts/release.sh tags main as vYY.M.D (e.g. v26.7.10),
# this workflow builds and signs each platform's artifact, then publishes them
# in one GitHub release together with the per-platform manifests the in-app
# update checker reads (latest.json on macOS, latest-windows.json on Windows).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Build universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create \
            target/aarch64-apple-darwin/release/kessel \
            target/x86_64-apple-darwin/release/kessel \
            -output target/universal/kessel

      - name: Bundle, sign, notarize, package
        env:
          KESSEL_BIN: target/universal/kessel
          KESSEL_REQUIRE_SIGNING: "1"
          KESSEL_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          scripts/bundle.sh release
          scripts/package.sh

      - name: Write update manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="target/dist/Kessel-${VERSION}.dmg"
          SHA256=$(cat "${DMG}.sha256")
          cat > target/dist/latest.json <<EOF
          {
            "version": "${VERSION}",
            "tag": "${GITHUB_REF_NAME}",
            "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Kessel-${VERSION}.dmg",
            "sha256": "${SHA256}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            target/dist/Kessel-*.dmg
            target/dist/Kessel-*.dmg.sha256
            target/dist/latest.json
          if-no-files-found: error

  windows:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # WINDOWS_CERT_PFX_BASE64 is the base64 of the .pfx file. Releases must
      # be signed: without it or WINDOWS_CERT_THUMBPRINT the packaging script
      # fails the job.
      - name: Write the signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          if (-not $env:PFX_BASE64) { exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'kessel-codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          "KESSEL_WIN_CERT=$pfx" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Build, sign and package
        shell: pwsh
        env:
          KESSEL_REQUIRE_SIGNING: "1"
          KESSEL_WIN_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
          KESSEL_WIN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: scripts/package-windows.ps1

      - name: Remove the signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'kessel-codesign.pfx') -ErrorAction SilentlyContinue

      - name: Write update manifest
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $exe = "kessel-$version-x86_64.exe"
          $sha = Get-Content "target/dist/$exe.sha256"
          $manifest = [ordered]@{
            version  = $version
            tag      = $env:GITHUB_REF_NAME
            url      = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$exe"
            sha256   = $sha
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          }
          $manifest | ConvertTo-Json | Set-Content target/dist/latest-windows.json

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/dist/kessel-*-x86_64.exe
            target/dist/kessel-*-x86_64.exe.sha256
            target/dist/kessel-*-x86_64.zip
            target/dist/kessel-*-x86_64.zip.sha256
            target/dist/latest-windows.json
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Extract changelog section
        run: |
          # The block for this tag: from its "## [vYY.M.D]" heading to the next "## "
          awk -v tag="$GITHUB_REF_NAME" '
            $0 ~ "^## \\[" tag "\\]" { on=1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "See CHANGELOG.md" > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "kessel $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            dist/*
