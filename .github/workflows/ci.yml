name: CI

# kessel is built for macOS and Windows from one tree, and most of what breaks
# a Windows build (a unix-only crate, `std::os::unix`, a path assumption) does
# so at compile time. Building both on every push catches it here rather than
# at tag time, when the release workflow would be the first Windows compile.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-14 }
          - { name: Windows, os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --all-targets

      - name: Tests
        run: cargo test
