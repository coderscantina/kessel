[package]
name = "kessel"
version = "26.7.12"
edition = "2021"
description = "A fast, native desktop file manager for remote filesystems, built on Apache OpenDAL."
authors = ["Coders Cantina <hello@coderscantina.com>"]
homepage = "https://www.coderscantina.com"
license = "MIT"

[dependencies]
# GUI — both published on crates.io. gpui-component 0.6 pins `gpui-pre` (a
# crates.io snapshot of zed's gpui newer than the 0.2 release), so kessel
# imports the same crate under the `gpui` name to keep one gpui in the tree.
gpui = { package = "gpui-pre", version = "0.3.6" }
gpui-component = "0.6"
# The native platform backends moved out of gpui into gpui_platform; its
# `application()` picks the right one for the target. Features mirror the
# defaults gpui itself had before the split.
gpui_platform = { package = "gpui-pre-platform", version = "0.3.6", features = [
  "font-kit",
  "wayland",
  "x11",
] }

# Async runtime (OpenDAL + sqlx are async). gpui has its own executor; kessel
# owns a dedicated tokio runtime (held in AppState) for all I/O work.
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "fs",
  "io-util",
  "sync",
  "time",
] }

# Storage layer — every backend is an OpenDAL Operator.
# `services-sftp` is deliberately absent here: it pulls in `openssh`, which
# hard-errors on non-unix targets. It is re-added for unix below, and the
# sftp backend simply doesn't exist in the Windows build (see src/sftp.rs).
opendal = { version = "0.58", features = [
  "services-s3",
  "services-fs",
  "services-ftp",
  "services-webdav",
  "services-gcs",
  "services-azblob",
  "services-gdrive",
  "services-dropbox",
  "services-onedrive",
  "layers-tracing",
] }

# S3 ListBuckets — OpenDAL Operators are bucket-scoped, so the "browse all
# buckets" root needs one hand-signed request. reqsign 0.20 is a facade over
# reqsign-core + service crates; kessel signs directly with reqsign-aws-v4 and
# the reqwest http-send helper, aligned with what opendal itself pulls in.
reqsign = { version = "0.20", default-features = false, features = [
  "aws",
  "default-context",
] }
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  # `.form()` for the OAuth token exchange is gated behind this in reqwest 0.13.
  "form",
] }
# `http` request parts are what reqsign 0.20 signs; same major as reqwest/reqsign use.
http = "1"

# FTP rename side channel (OpenDAL's FTP service has no rename). Same client
# and TLS stack the service itself builds on, so nothing new is compiled.
suppaftp = { version = "8", default-features = false, features = ["async-std-rustls-ring"] }
futures-rustls = "0.26"
rustls-native-certs = "0.8"

# Local state
sqlx = { version = "0.9", features = [
  "runtime-tokio",
  "sqlite",
  "migrate",
  "chrono",
] }

# Config (JSON5 with live-reload-friendly layering)
config = { version = "0.15", features = ["json5"] }
dirs = "6"

# Hot reload of theme / icon-theme extensions (both already in the dependency
# tree via gpui-component; pinned to the same majors)
notify = "7"
smol = "2"

# Streaming directory expansion (opendal::Lister is a Stream); already in the
# tree via opendal.
futures = "0.3"

# Timestamp preservation on local destinations — OpenDAL's write path cannot
# set mtime, so the fs backend gets a native escape hatch.
filetime = "0.2"

# Local deletes from the file pane go to the OS trash / Recycle Bin.
trash = "5.3"

# Secrets — OS keychain only, never SQLite. keyring 4's default `v1` feature
# wires up each platform's native store (macOS Keychain, Windows Credential
# Manager, Linux Secret Service) with the right backend sub-features.
keyring = "4"

# OAuth for cloud drives (Drive, Dropbox, OneDrive): PKCE + loopback
# redirect; the token exchange rides the reqwest already in the tree.
sha2 = "0.10"
# AWS IAM Identity Center token cache is keyed by SHA-1 of the SSO start URL
# (the aws-cli / reqsign convention). Already in the tree via reqsign-aws-v4.
sha1 = "0.10"
base64 = "0.22"
rand = "0.10"
url = "2"
quick-xml = "0.41"

# Zed theme / icon-theme extension downloads: the Zed API serves each
# extension as a gzipped tar, which the theme browser unpacks into
# <data_dir>/extensions/. flate2 is already in the tree; named here as a
# direct dep for the GzDecoder used alongside tar.
tar = "0.4"
flate2 = "1"

# Errors
thiserror = "2"
anyhow = "1"

# Native drag-out (dragging entries to Finder / other apps): gpui only
# supports *incoming* external drags, so the outbound side is patched on top
# via the raw window handle — same major gpui builds against.
raw-window-handle = "0.6"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Keybindings — user-editable keymap file (same JSON5 dialect as config);
# schemars is required by gpui's Action derive for actions carrying data.
json5 = "1"
schemars = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# Embedded MCP (Model Context Protocol) server — the official Rust SDK. Only
# the server half is compiled, over the streamable-HTTP transport (a GUI app
# owns its stdio, so stdio transport is pointless): clients connect to
# http://127.0.0.1:<port>/mcp. `macros` gives the #[tool_router]/#[tool]
# attributes; `tower` lets the service mount into the axum router. Disabled by
# default at runtime (see config.mcp.enabled).
rmcp = { version = "2.2", features = [
  "server",
  "macros",
  "tower",
  "transport-streamable-http-server",
  "transport-streamable-http-server-session",
] }
# HTTP server the MCP streamable transport mounts into; same axum major rmcp
# builds against.
axum = "0.8"

# SFTP — the transport is `openssh`, which only builds on unix (it drives the
# system `ssh` binary through a ControlMaster socket). Both OpenDAL's sftp
# service and kessel's own session for permissions/chmod ride on it, so the
# whole backend is unix-only.
[target.'cfg(unix)'.dependencies]
opendal = { version = "0.58", features = ["services-sftp"] }
openssh-sftp-client = { version = "0.15", features = ["openssh"] }

# AppKit bindings for the native drag-out session (NSDraggingSession +
# NSFilePromiseProvider); versions match what gpui already pulls in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["block2"] }
block2 = "0.6"
# renamex_np, to swap the app bundle atomically during an update.
libc = "0.2"

# Win32 bindings for the native drag-out session (an OLE data object over the
# shell's file-promise protocol). Same major gpui already builds against, so
# feature unification adds no compile weight — only the Com_Marshal module is
# new here.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_Marshal",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
] }
# `#[implement]` expands to `::windows_core::…` paths, so the COM data object
# needs windows-core named directly (gpui pins the same version).
windows-core = "0.62"

# Windows resource section: the app icon Explorer and the taskbar show, plus
# the version/company strings the file properties dialog reads. Compiled into
# the executable by build.rs.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev]
# gpui is heavy; keep dependencies optimized in dev builds
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release.build-override]
# The default release strip runs Apple's `strip` over proc-macro dylibs too.
# With the macOS 27 toolchain its output is rejected by dyld ("mis-aligned
# LINKEDIT string pool"), so leave build-time artifacts unstripped.
strip = false

# OpenDAL 0.58 hands `host:port` to TLS as the server name, which rustls rejects,
# so every FTPS connection fails. Drop this patch once upstream passes the host.
[patch.crates-io]
opendal-service-ftp = { path = "patches/opendal-service-ftp" }
